[project]
name = "nibemote"
version = "0.1.0"
description = "RS485 remote controller for Nibe F2025 + VVM300 (replaces the display panel), with MQTT / Home Assistant bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
    "paho-mqtt>=2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
nibemote = "nibemote.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nibemote"]

[tool.hatch.build.targets.wheel.force-include]
"src/nibemote/data" = "nibemote/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
