# nibemote2 — passive bus sniffer (never transmits).
#
# Flash this first with the physical display still attached to the VVM300 and the
# F2025 running. It logs every poll, control byte and frame (see nibe log lines in
# the console, `esphome logs`), shows the display rows as text sensors, and records
# the real panel's key frames — all the data needed to re-verify the protocol
# assumptions in docs/protocol.md before the emulator is ever allowed on the bus.
#
# 9-bit line mode: the bus physically carries a 9th marking slot (protocol.md).
# The transport reads it on every byte and always marks its own ENQ 1 / data 0;
# nothing here transmits.
#
# Hardware (Waveshare ESP32-S3-Relay-1CH):
#   RS485 A/B   -> VVM300 display RJ45 (the display stays connected!)
#   RS485 GND   -> display RJ45 GND
#   Power       -> board's own 5 V (USB while at the laptop)
#   RS485_EN    -> GPIO21, driven LOW the whole time (receive-only). ADD A 10k
#                  pull-down on GPIO21 so the pin can't float high during boot.
#
# SAFETY: rs485_bus `active: false` locks the transceiver to receive. Nothing in
# this config can put a byte on the bus. Do not change that for sniffing!

substitutions:
  name: nibemote-sniffer
  friendly_name: "Nibe bus sniffer"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "Nibe VVM300/F2025 — passive RS485 sniffer (phase 1)"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components

rs485_bus:
  - id: nibe_rs485
    uart_num: 2              # v8: try UART2 (UART1 domain kept reading as disabled)
    rx_pin: GPIO18
    tx_pin: GPIO17
    en_pin: GPIO21           # RS485_EN (drive LOW = receive)
    baud_rate: 19200
    gap_symbols: 4           # ~2.1 ms silence => one gap event; calibrate with the gap sensor
    active: false            # SNIFFER: never transmits, EN held low
    rx_buffer: 16384         # 3-4 s of raw trace at full bus rate

nibe:
  - id: nibe_bus
    rs485_bus_id: nibe_rs485
    role: passive
    address: 0x00F9
    log_level: 2             # 0=summary, 1=line per exchange/frame, 2=+ctrl/gaps

text_sensor:
  - platform: nibe
    nibe_id: nibe_bus
    display_row: 2
    name: "Display row 2"
  - platform: nibe
    nibe_id: nibe_bus
    display_row: 3
    name: "Display row 3"
  - platform: nibe
    nibe_id: nibe_bus
    display_row: 4
    name: "Display row 4"
  - platform: nibe
    nibe_id: nibe_bus
    display_row: 1
    name: "Display row 1 (symbols, hex)"
  - platform: nibe
    nibe_id: nibe_bus
    last_key: true
    name: "Last key (real panel)"

sensor:
  - platform: nibe
    nibe_id: nibe_bus
    counter: frames
    name: "Frames OK"
  - platform: nibe
    nibe_id: nibe_bus
    counter: frames_bad
    name: "Frames bad checksum"
  - platform: nibe
    nibe_id: nibe_bus
    counter: polls_own
    name: "Polls to display"
  - platform: nibe
    nibe_id: nibe_bus
    counter: polls_other
    name: "Polls to other nodes"
  - platform: nibe
    nibe_id: nibe_bus
    counter: anomalies
    name: "Anomalies"
  - platform: nibe
    nibe_id: nibe_bus
    counter: parity_errors
    name: "Parity-slot mismatches"
  - platform: nibe
    nibe_id: nibe_bus
    counter: framing_errors
    name: "Framing errors (stop bit = 0)"
  - platform: nibe
    nibe_id: nibe_bus
    last_gap_ms: true
    name: "Last bus gap"
    unit_of_measurement: ms
    accuracy_decimals: 2

binary_sensor:
  - platform: nibe
    nibe_id: nibe_bus
    polled: true
    name: "Display polled"

logger:
  level: DEBUG
  hardware_uart: USB_CDC

api:
  reboot_timeout: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} Fallback"

captive_portal:

web_server:
  log: false

ota:
  - platform: esphome
